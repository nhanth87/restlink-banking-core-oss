# Restlink-core — restlink-app (Phase 1). Java 25 only.

quarkus.http.port=8090
quarkus.application.name=restlink-app

# --- Datastore (native WALLET_LEDGER + txn journal) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${RESTLINK_DB_USER:restlink}
quarkus.datasource.password=${RESTLINK_DB_PASS:restlink}
quarkus.datasource.jdbc.url=${RESTLINK_DB_URL:jdbc:postgresql://127.0.0.1:5432/restlink}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- Core banking provider (Phase 1 = native wallet; Phase 2 = FINERACT/TEMENOS) ---
# Money never falls back to another provider. Unregistered default ⇒ fail-closed.
restlink.core.default-provider=${RESTLINK_CORE_PROVIDER:WALLET_LEDGER}
# Optional per-tenant overrides: et:FINERACT,ke:WALLET_LEDGER
restlink.core.tenant-bindings=${RESTLINK_CORE_BINDINGS:}

# --- N-N HA cluster (LOCAL single-node lab; DIST_SYNC for N nodes) ---
restlink.cluster.mode=${RESTLINK_CLUSTER_MODE:LOCAL}
restlink.cluster.name=${RESTLINK_CLUSTER_NAME:restlink}
restlink.node.name=${RESTLINK_NODE_NAME:restlink-1}
# P1: N>=2 MUST set RESTLINK_CLUSTER_MODE=DIST_SYNC. LOCAL is single-node lab only.

# --- Admin (peer-truth status). REQUIRED: set RESTLINK_ADMIN_KEY — default "change-me" is rejected (min 12 chars). ---
restlink.admin.key=${RESTLINK_ADMIN_KEY:change-me}
restlink.admin.ui-dir=${RESTLINK_ADMIN_UI_DIR:app/html}

# --- Public API key (M1). REQUIRED for /customers and /wallet. Default "change-me" is rejected. ---
restlink.api.key=${RESTLINK_API_KEY:change-me}

# --- Profile/CMP heap working set (Postgres is the full set; never rehydrate-all) ---
restlink.profile.cache-max=${RESTLINK_PROFILE_CACHE_MAX:10000}

# --- Temporal payment saga (self-hosted; money plane fail-closed when unreachable) ---
restlink.temporal.enabled=${RESTLINK_TEMPORAL_ENABLED:true}
restlink.temporal.target=${RESTLINK_TEMPORAL_TARGET:127.0.0.1:7233}
restlink.temporal.namespace=${RESTLINK_TEMPORAL_NAMESPACE:restlink}
restlink.temporal.fail-open-on-startup=${RESTLINK_TEMPORAL_FAIL_OPEN:false}

# --- Phase 2 core RA endpoints (registered only when base-url is set) ---
# Fineract best practices applied in ra-fineract: Idempotency-Key on writes, dateFormat+locale,
# savings lifecycle, externalId correlation, 4xx-vs-transport link-truth. See docs/design/03-fineract-best-practices.md
restlink.fineract.base-url=${RESTLINK_FINERACT_URL:}
restlink.fineract.tenant=${RESTLINK_FINERACT_TENANT:default}
restlink.fineract.user=${RESTLINK_FINERACT_USER:mifos}
restlink.fineract.password=${RESTLINK_FINERACT_PASS:password}
restlink.fineract.insecure-tls=${RESTLINK_FINERACT_INSECURE_TLS:false}
# Second gate: trust-all TLS is lab-only. Both flags must be true; prod leaves both false.
restlink.fineract.allow-insecure-tls-lab=${RESTLINK_FINERACT_ALLOW_INSECURE_TLS_LAB:false}
restlink.temenos.ofs-url=${RESTLINK_TEMENOS_URL:}
restlink.temenos.user=${RESTLINK_TEMENOS_USER:INPUTT}
restlink.temenos.password=${RESTLINK_TEMENOS_PASS:123456}
restlink.temenos.company=${RESTLINK_TEMENOS_COMPANY:GB0010001}
